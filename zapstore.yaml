name: Madeira Wine and Rum
summary: A visual guide to Madeira Wine, rum and island tasting stops.
description: |
  Explore Madeira through real island photography, wine and rum stories,
  and a suggested seven-day tasting trip.

  Explore red, white and rosé table wines, with a dedicated rosé section.
  Fortified Madeira Wine has its own dry-to-sweet style guide.

  Browse photo cards, save places on an offline map, find bottles by taste,
  and watch curated videos on YouTube. Tap for tasting tips, booking
  information and Google Maps links.

  Switch between English and German with the flag in the header. Explore
  full detail screens with simple Back navigation. The app follows your
  system light or dark theme.

  Photography and the guide work offline. Videos and external links may
  need a connection. No autoplay, account, analytics or location permission.
  Photographer credits, licenses and guide sources are included in the app.
