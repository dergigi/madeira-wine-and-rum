name: Madeira Wine and Rum
summary: Explore Madeira Wine, rum and the island’s tasting stops.
description: |
  Discover what makes Madeira Wine and agricultural rum special, then plan
  your own island tasting trip.

  Explore ten places on an offline interactive map, save your favourites,
  follow a suggested seven-day itinerary and find bottles by taste.
  Each stop includes tasting tips, visit information and Google Maps links.
  Articles and recommendations include sources reviewed on 23 October 2026.

  The island map works offline; external navigation and booking links may
  need a connection. No account, analytics or location permission required.
